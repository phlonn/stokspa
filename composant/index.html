<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Gestion de dépôt – Palettes d'eau</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#f3f5f8; --panel:#fff; --ink:#14212e; --muted:#5f6f80; --line:#dde3ea;
  --nav:#0f2233; --nav2:#17324a; --accent:#0a7cc2; --accent2:#e6f2fa;
  --ok:#2e9d5b; --okbg:#e3f4ea; --soon:#d98a00; --soonbg:#fff2d6; --bad:#c9372c; --badbg:#fbe4e2; --free:#eef1f4;
  --r:10px;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{font-family:"IBM Plex Sans",system-ui,sans-serif;font-variant-numeric:tabular-nums;color:var(--ink);background:var(--bg);font-size:14px}
.mono{font-family:"IBM Plex Sans",system-ui,sans-serif;font-variant-numeric:tabular-nums;letter-spacing:.01em}
/* Streamlit interdit le défilement de son cadre : la page défile donc dans .app */
html,body{overflow:hidden}
.app{display:grid;grid-template-columns:220px 1fr;height:100vh;overflow-y:auto;-webkit-overflow-scrolling:touch;overscroll-behavior:contain}
nav{background:var(--nav);color:#cfe0ee;padding:18px 12px;display:flex;flex-direction:column;gap:4px;position:sticky;top:0;height:100vh;box-sizing:border-box;z-index:5}
nav .brand{display:flex;align-items:center;gap:10px;padding:4px 8px 18px;color:#fff;font-weight:700;font-size:15px;line-height:1.2}
nav .brand svg{flex:none}
nav a{display:flex;align-items:center;gap:10px;color:#cfe0ee;text-decoration:none;padding:9px 10px;border-radius:8px;font-weight:500}
nav a:hover{background:var(--nav2)}
nav a.on{background:var(--accent);color:#fff}
nav .sp{flex:1}
nav .mode{font-size:12px;padding:8px 10px;border-radius:8px;background:var(--nav2);line-height:1.4}
main{padding:22px 28px 60px;min-width:0}
header.top{display:flex;align-items:center;gap:12px;margin-bottom:18px;flex-wrap:wrap}
header.top h1{font-size:21px;margin:0;flex:1;min-width:200px}
.search{position:relative}
.search input{width:280px}
.search .res{position:absolute;right:0;top:40px;width:380px;background:#fff;border:1px solid var(--line);border-radius:var(--r);box-shadow:0 8px 24px rgba(0,0,0,.12);z-index:20;max-height:360px;overflow:auto}
.search .res div{padding:9px 12px;border-bottom:1px solid var(--line);cursor:pointer}
.search .res div:hover{background:var(--accent2)}
input,select,textarea{font:inherit;color:inherit;border:1px solid var(--line);border-radius:8px;padding:8px 10px;background:#fff;min-width:0}
input:focus,select:focus{outline:2px solid var(--accent);outline-offset:-1px;border-color:transparent}
button{font:inherit;cursor:pointer;border:1px solid var(--line);background:#fff;border-radius:8px;padding:8px 14px;font-weight:500;color:var(--ink)}
button:hover{background:#f6f8fa}
button.pri{background:var(--accent);border-color:var(--accent);color:#fff}
button.pri:hover{background:#086aa6}
button.yellow{background:#ffd43b;border-color:#f2c200;color:#3d3000}
button.yellow:hover{background:#fcc419}
button.danger{color:var(--bad);border-color:#efc3bf}
button.danger:hover{background:var(--badbg)}
button.sm{padding:4px 9px;font-size:12.5px}
button:disabled{opacity:.5;cursor:not-allowed}
.card{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:16px 18px;margin-bottom:16px}
.card h2{font-size:15px;margin:0 0 12px;display:flex;align-items:center;gap:8px}
.card h2 .x{flex:1}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:12px;margin-bottom:16px}
.kpi{background:#fff;border:1px solid var(--line);border-radius:var(--r);padding:14px 16px}
.kpi .l{color:var(--muted);font-size:12.5px;font-weight:500}
.kpi .v{font-size:26px;font-weight:700;margin-top:4px}
.kpi .s{font-size:12px;color:var(--muted)}
.kpi.bad .v{color:var(--bad)} .kpi.soon .v{color:var(--soon)}
.bar{height:6px;background:var(--free);border-radius:3px;margin-top:8px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--accent)}
table{width:100%;border-collapse:collapse}
th,td{text-align:left;padding:8px 10px;border-bottom:1px solid var(--line);vertical-align:middle}
th{font-size:12px;color:var(--muted);font-weight:600;text-transform:uppercase;letter-spacing:.03em;background:#fafbfc;position:sticky;top:0}
tr.click{cursor:pointer} tr.click:hover td{background:#f7fafc}
tr.deprow:hover td{background:rgba(0,0,0,.05)}
tr.prod-sep td{border-top:2px solid #000}
table.compact td{padding:3px 10px;line-height:1.25}
table.compact th{padding:6px 10px}
table.compact .tag{padding:1px 7px}
table.compact button.sm{padding:1px 8px;font-size:12px}
.num{text-align:right;font-variant-numeric:tabular-nums}
.tag{display:inline-block;padding:2px 8px;border-radius:20px;font-size:12px;font-weight:600;white-space:nowrap}
.t-ok{background:var(--okbg);color:var(--ok)} .t-soon{background:var(--soonbg);color:#a26700} .t-bad{background:var(--badbg);color:var(--bad)}
.t-in{background:var(--okbg);color:var(--ok)} .t-out{background:var(--accent2);color:var(--accent)} .t-mv{background:#efeaf9;color:#6a46b8} .t-rb{background:var(--badbg);color:var(--bad)}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:end}
.f{display:flex;flex-direction:column;gap:5px}
.f label{font-size:12.5px;color:var(--muted);font-weight:500}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:16px}
@media (max-width:1000px){.grid2{grid-template-columns:1fr}}
.muted{color:var(--muted)}
.empty{padding:24px;text-align:center;color:var(--muted)}
.scroll{max-height:520px;overflow:auto;border:1px solid var(--line);border-radius:8px}
.scroll table th{border-bottom:1px solid var(--line)}
/* plan */
.depots{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:16px;align-items:start}
.aisle{margin-bottom:0}
.lvh{font-size:11px;color:var(--muted);font-weight:600;text-align:center;padding-bottom:2px}
.aisle h3{margin:0 0 8px;font-size:14px}
.rack{display:grid;gap:4px;overflow-x:auto;padding-bottom:4px}
.cell{min-width:74px;height:58px;border-radius:6px;border:1px solid var(--line);background:var(--free);padding:4px 6px;font-size:11px;cursor:pointer;display:flex;flex-direction:column;justify-content:space-between;overflow:hidden}
.cell .id{font-family:"IBM Plex Sans",system-ui,sans-serif;font-variant-numeric:tabular-nums;font-weight:600;font-size:10.5px;color:var(--muted)}
.cell .p{font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.cell.ok{background:var(--okbg);border-color:#b7e0c6}
.cell.soon{background:var(--soonbg);border-color:#f1d18a}
.cell.bad{background:var(--badbg);border-color:#efb5b0}
.cell.hl{outline:3px solid var(--accent);outline-offset:1px}
.cell:hover{filter:brightness(.97)}
.cell{height:auto;min-height:58px;gap:3px}
.cell .plist{display:grid;grid-template-columns:max-content max-content max-content;column-gap:5ch;row-gap:1px;align-items:center;font-size:12px;font-family:"IBM Plex Sans",sans-serif;font-variant-numeric:tabular-nums}
.cell .pl{display:contents}
.cell .pl .pc{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.cell .pl b{text-align:right}
.cell .pl .pd{font-variant-numeric:tabular-nums;text-align:left}
.dlc-g{color:var(--ok);font-weight:700} .dlc-r{color:var(--bad);font-weight:700} .dlc-n{color:var(--muted)}
.cell .id .lc{font-size:16px;font-weight:700;color:var(--ink);letter-spacing:.02em}
.impt input{padding:4px 6px;font-size:13px}
.cell .fill{display:block;height:3px;background:rgba(0,0,0,.08);border-radius:2px;overflow:hidden}
.cell .fill i{display:block;height:100%;background:var(--accent)}
.lvl{font-size:11px;color:var(--muted);display:flex;align-items:center;justify-content:flex-end;padding-right:4px;font-weight:600;font-variant-numeric:tabular-nums}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:12.5px;color:var(--muted)}
.legend i{display:inline-block;width:12px;height:12px;border-radius:3px;margin-right:5px;vertical-align:-2px;border:1px solid var(--line)}
/* modal / toast */
.ov{position:fixed;inset:0;background:rgba(15,34,51,.45);display:flex;align-items:center;justify-content:center;z-index:50;padding:20px}
.modal{background:#fff;border-radius:12px;max-width:520px;width:100%;padding:20px 22px;box-shadow:0 20px 60px rgba(0,0,0,.25);max-height:90vh;overflow:auto}
.modal h3{margin:0 0 12px;font-size:17px}
.modal .acts{display:flex;justify-content:flex-end;gap:8px;margin-top:18px}
.kv{display:grid;grid-template-columns:140px 1fr;gap:6px 12px;font-size:13.5px}
.kv div:nth-child(odd){color:var(--muted)}
#toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:var(--nav);color:#fff;padding:10px 16px;border-radius:8px;z-index:60;display:none;max-width:90vw}
#toast.err{background:var(--bad)}
.banner{background:var(--soonbg);border:1px solid #f1d18a;color:#7a5200;padding:10px 14px;border-radius:8px;margin-bottom:16px;font-size:13px}
.steps{counter-reset:s;padding-left:0;list-style:none;margin:0}
.steps li{padding:4px 0 4px 28px;position:relative}
.steps li::before{counter-increment:s;content:counter(s);position:absolute;left:0;top:4px;width:20px;height:20px;border-radius:50%;background:var(--accent2);color:var(--accent);font-size:12px;font-weight:700;display:flex;align-items:center;justify-content:center}
@media (max-width:760px){.app{display:block} nav{flex-direction:row;overflow-x:auto;padding:8px;height:auto} nav .brand,nav .sp,nav .mode{display:none} nav a{white-space:nowrap} main{padding:16px} .search input{width:100%}}
</style>
</head>
<body>
<div class="app">
<nav id="nav">
  <div class="brand">
    <svg width="28" height="28" viewBox="0 0 24 24" fill="none"><path d="M12 2.5c3.5 4.4 6 7.9 6 11a6 6 0 0 1-12 0c0-3.1 2.5-6.6 6-11z" fill="#3aa6e6"/><path d="M9.2 14.2a3 3 0 0 0 2.8 2.6" stroke="#fff" stroke-width="1.6" stroke-linecap="round"/></svg>
    <span>Dépôt<br><span style="font-weight:400;font-size:12px;color:#9fb8cc">Gestion palettes</span></span>
  </div>
  <a href="#accueil" data-v="accueil">▦ Tableau de bord</a>
  <a href="#plan" data-v="plan">▤ Plan du dépôt</a>
  <a href="#stock" data-v="stock">☰ Stock palettes</a>
  <a href="#reception" data-v="reception">⤓ Réception</a>
  <a href="#sortie" data-v="sortie">⤒ Sortie (FEFO)</a>
  <a href="#commande" data-v="commande">▣ Commande (PDF)</a>
  <a href="#mouvements" data-v="mouvements">⇄ Mouvements</a>
  <a href="#parametres" data-v="parametres">⚙ Produits & emplacements</a>
  <a href="#donnees" data-v="donnees">🔒 Gestion des données</a>
  <div class="sp"></div>
  <div class="mode" id="mode">Connexion…</div>
</nav>
<main>
  <header class="top">
    <h1 id="title">Tableau de bord</h1>
    <div class="search">
      <input id="q" placeholder="Rechercher un emplacement ou un produit…" autocomplete="off">
      <div class="res" id="qres" style="display:none"></div>
    </div>
  </header>
  <div id="banner"></div>
  <div id="view"></div>
</main>
</div>
<div id="toast"></div>

<script>
/* ============ ÉTAT ============
   Modèle : une ligne de stock = emplacement + produit + DLC (mois) + quantité de palettes.
   Aucune palette n'est numérotée individuellement. */
const S = {products:{}, locations:{}, stock:{}, movements:{}, pallets:{}, settings:{alertMonths:2}};
const COLLS = ["products","locations","stock","movements","pallets"]; // "pallets" = ancien format, migré automatiquement
let backend = null, canWrite = true, loaded = false, dbRef = null, migrating = false;
let ui = {view:"accueil", hl:null, stockFilter:{p:"",st:"",q:""}, stockSort:{k:"product",dir:1}, mvFilter:{t:"",q:""}, recep:null, sortie:null};

const $ = s => document.querySelector(s);
const esc = v => String(v ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const safeId = s => String(s).trim().replace(/[^A-Za-z0-9_.~:@+-]/g,"_").slice(0,150) || "_";
const uid = p => p + "-" + Date.now().toString(36).toUpperCase() + Math.random().toString(36).slice(2,6).toUpperCase();
const today = () => { const d=new Date(); d.setHours(0,0,0,0); return d; };
/* DLC au mois : "AAAA-MM". Périmé à partir du mois qui suit la DLC. */
const dlcM = d => String(d||"").slice(0,7);
const dkey = d => dlcM(d) || "9999-99"; // sans DLC = classé en dernier
const monthsLeft = dlc => { const [y,m]=dlcM(dlc).split("-").map(Number); const n=new Date(); return (y*12+m-1)-(n.getFullYear()*12+n.getMonth()); };
const alertM = () => { const v=parseInt(S.settings.alertMonths); return v>=0 ? v : 2; };
const fmtD = d => { const v=dlcM(d); return v.length===7 ? v.slice(5)+"/"+v.slice(2,4) : "—"; };
const fmtTs = t => new Date(t).toLocaleString("fr-BE",{day:"2-digit",month:"2-digit",year:"numeric",hour:"2-digit",minute:"2-digit"});
const status = x => { if(!dlcM(x.dlc)) return "none"; const d = monthsLeft(x.dlc); return d < 0 ? "bad" : d <= alertM() ? "soon" : "ok"; };
const stTag = x => { if(!dlcM(x.dlc)) return `<span class="tag" style="background:#eef1f4;color:var(--muted)">Sans DLC</span>`; const d = monthsLeft(x.dlc), s = status(x);
  const txt = s==="bad" ? `Périmé (${-d} mois)` : d===0 ? "Ce mois-ci" : `${d} mois`;
  return `<span class="tag t-${s}">${txt}</span>`; };
const prodName = c => S.products[safeId(c)]?.name || c;
const locSort = (a,b) => (a.aisle||"").localeCompare(b.aisle||"",undefined,{numeric:true}) || (a.pos-b.pos) || ((a.level||0)-(b.level||0));
const locOf = id => S.locations[id] || {aisle:id,pos:0};
const fefo = (a,b) => dkey(a.dlc).localeCompare(dkey(b.dlc)) || locSort(locOf(a.loc),locOf(b.loc));
/* Code d'emplacement affiché attaché : dépôt + position (ex. D303) */
const L = id => { const l=S.locations[id]; if(l) return `${l.aisle}${String(l.pos).padStart(2,"0")}${+l.level?"-"+l.level:""}`;
  const pr=String(id||"").split("-"); if(pr.length===3 && pr[2]==="0") pr.pop(); return pr.join(""); };
const cap = l => Math.max(1, parseInt(l?.cap) || 1);
const qty = x => Math.max(0, parseInt(x?.qty) || 0);
const lines = () => Object.values(S.stock).filter(x=>qty(x)>0);
const lineId = (loc,product,dlc) => safeId(`${loc}__${product}__${dlcM(dlc)}`);
const sumQ = arr => arr.reduce((s,x)=>s+qty(x),0);
const byLoc = () => { const m={}; for (const x of lines()) if (x.loc) (m[x.loc] ||= []).push(x); return m; };
const used = (bl,id) => sumQ(bl[id]||[]);
const worst = xs => xs.some(x=>status(x)==="bad") ? "bad" : xs.some(x=>status(x)==="soon") ? "soon" : "ok";
const totalCap = () => Object.values(S.locations).reduce((s,l)=>s+cap(l),0);
/* Couleur des DLC : pour chaque produit, la DLC la plus proche en vert, toutes les autres en rouge */
let _minD=null;
const minDlc = () => { if(!_minD){ _minD={}; for(const x of lines()){ const d=dlcM(x.dlc); if(d && (!_minD[x.product]||d<_minD[x.product])) _minD[x.product]=d; } } return _minD; };
const dlcCls = (product,dlc) => !dlcM(dlc) ? "dlc-n" : dlcM(dlc)===minDlc()[product] ? "dlc-g" : "dlc-r";
const DL = (product,dlc) => `<span class="${dlcCls(product,dlc)}">${fmtD(dlc)}</span>`;
/* Couleur de fond des lignes par dépôt (Stock par emplacement) */
const DEPOT_BG = {D:"#ffe3c2", E:"#ffe3c2", F:"#d9f2df", G:"#ffffff", H:"#d6e8fb"};
const depotBg = loc => DEPOT_BG[(locOf(loc).aisle||"").toUpperCase()] || "";
const mq = m => Math.max(1, parseInt(m.qty) || 1); // quantité d'un mouvement (anciens mouvements = 1 palette)
let opName = ""; try { opName = localStorage.getItem("depot_op") || ""; } catch(e){}

function toast(msg, err){ const t=$("#toast"); t.textContent=msg; t.className=err?"err":""; t.style.display="block"; clearTimeout(t._h); t._h=setTimeout(()=>t.style.display="none",3200); }

/* ============ PERSISTANCE ============ */
const localBackend = {
  async put(c,id,data){ S[c][id]={...data,id}; saveLocal(); render(); },
  async del(c,id){ delete S[c][id]; saveLocal(); render(); },
  async setSettings(d){ S.settings={...S.settings,...d}; saveLocal(); render(); }
};
function saveLocal(){ try{ const {pallets,...rest}=S; localStorage.setItem("depot_data", JSON.stringify(rest)); }catch(e){} }
function loadLocal(){ try{ const d=JSON.parse(localStorage.getItem("depot_data")||"null"); if(d) Object.assign(S,d);
  // ancien format local : palettes individuelles -> lignes de quantité
  if (d && d.pallets && Object.keys(d.pallets).length){ for(const p of Object.values(d.pallets)){ const id=lineId(p.loc,p.product,p.dlc); const cur=S.stock[id]; S.stock[id]={id,loc:p.loc,product:p.product,dlc:dlcM(p.dlc),qty:qty(cur)+1}; } S.pallets={}; saveLocal(); }
  S.stock ||= {}; }catch(e){} }

function makeDbBackend(db){
  const handle = e => { if (e && e.code==="invalid_argument"){ canWrite=false; toast("Vous n'avez pas les droits d'écriture sur ce dépôt.",true); render(); } else if (e && e.code==="quota_exceeded"){ toast("Capacité de la base atteinte : supprimez d'anciens mouvements.",true);} else toast("Erreur d'enregistrement, réessayez.",true); throw e; };
  return {
    put:(c,id,data)=>db.doc(c+"/"+id).set({...data,id}).catch(handle),
    del:(c,id)=>db.doc(c+"/"+id).delete().catch(handle),
    setSettings:d=>db.doc("config/settings").set({...S.settings,...d}).catch(handle)
  };
}

/* ============ VERSION HÉBERGÉE (Streamlit + Google Drive) ============
   La page tourne dans Streamlit. Chaque modification est appliquée tout de suite à l'écran,
   puis envoyée au serveur par lots ; le serveur l'enregistre dans Google Drive et renvoie les
   données à jour. Un seul message est en route à la fois (le suivant part après accusé de réception). */
const ST = {queue:[], inflight:[], out:[], cur:null, curT:0, rev:null, ready:false, timer:null, ocr:{}, lastErr:null};
const stSend = v => parent.postMessage({isStreamlitMessage:true, type:"streamlit:setComponentValue", value:v, dataType:"json"}, "*");
function applyOp(o){ if(o.settings) S.settings={...S.settings,...o.settings}; else if(o.del) delete S[o.c][o.id]; else S[o.c][o.id]={...o.data,id:o.id}; }
const stBackend = {
  async put(c,id,data){ stQueue({c,id,data:{...data,id}}); },
  async del(c,id){ stQueue({c,id,del:true}); },
  async setSettings(d){ stQueue({settings:d}); }
};
function stQueue(o){ applyOp(o); _minD=null; ST.queue.push(o); render(); stStatus(); clearTimeout(ST.timer); ST.timer=setTimeout(stFlush,250); }
function stFlush(){ if(!ST.queue.length) return; if(ST.inflight.length){ clearTimeout(ST.timer); ST.timer=setTimeout(stFlush,300); return; }
  ST.inflight=ST.queue; ST.queue=[]; stPost({kind:"ops", id:uid("OP"), ops:ST.inflight}); }
function stPost(m){ ST.out.push(m); stPump(); }
function stPump(){ if(ST.cur||!ST.out.length||!ST.ready) return; ST.cur=ST.out.shift(); ST.curT=Date.now(); stSend(ST.cur); stStatus(); }
function stStatus(){ const m=$("#mode"); if(!m) return; const busy=ST.queue.length||ST.inflight.length;
  m.innerHTML = `● Google Drive<br><span style='opacity:.75'>${busy?"enregistrement…":"enregistré ✓"}</span>`; }
function stOnRender(a){
  if(!ST.ready){ ST.ready=true; }
  if(a.error && a.error.id!==ST.lastErr){ ST.lastErr=a.error.id; toast(a.error.msg,true); }
  if(ST.cur && a.ack===ST.cur.id){ if(ST.cur.kind==="ops") ST.inflight=[]; ST.cur=null; }
  if(a.admin && ST.adminWait===a.admin.id){ ST.adminWait=null; ui.adm.busy=false;
    if(a.admin.ok){ ui.adm.ok=true; ui.adm.err=""; } else ui.adm.err=a.admin.msg||"Mot de passe incorrect.";
    render(); }
  if(a.ocr && ST.ocr[a.ocr.id]){ const p=ST.ocr[a.ocr.id]; delete ST.ocr[a.ocr.id]; a.ocr.error ? p.reject(a.ocr.error) : p.resolve(a.ocr.result); }
  if(a.data && a.rev!==ST.rev){ ST.rev=a.rev; const d=a.data;
    for(const c of COLLS) S[c]=d[c]||{}; S.settings={alertMonths:2,...(d.settings||{})};
    [...ST.inflight,...ST.queue].forEach(applyOp); _minD=null;
    if(!backend){ backend=stBackend; loaded=true; $("#banner").innerHTML=""; }
    render(); }
  stStatus(); stPump();
}
window.addEventListener("message", e=>{ const d=e.data; if(d && d.type==="streamlit:render") stOnRender(d.args||{}); });

/* Lecture de documents par Claude, faite par le serveur (clé API dans les secrets). */
function toJpegB64(blob){ return new Promise((ok,ko)=>{ const url=URL.createObjectURL(blob), im=new Image();
  im.onload=()=>{ const k=Math.min(1,2000/Math.max(im.width,im.height)), c=document.createElement("canvas"); c.width=Math.round(im.width*k); c.height=Math.round(im.height*k);
    const x=c.getContext("2d"); x.fillStyle="#fff"; x.fillRect(0,0,c.width,c.height); x.drawImage(im,0,0,c.width,c.height); URL.revokeObjectURL(url);
    ok({media_type:"image/jpeg", data:c.toDataURL("image/jpeg",0.88).split(",")[1]}); };
  im.onerror=()=>{ URL.revokeObjectURL(url); ko(new Error("image")); }; im.src=url; }); }
const stSample = {
  limits: async()=>({images:{maxCount:10}}),
  json: (prompt,{images,signal}={}) => new Promise(async(res,rej)=>{
    let imgs; try{ imgs=await Promise.all(images.map(toJpegB64)); }catch(e){ return rej({code:"image_rejected"}); }
    const id=uid("OCR"); ST.ocr[id]={resolve:res,reject:rej};
    if(signal) signal.addEventListener("abort",()=>{ if(ST.ocr[id]){ delete ST.ocr[id]; rej({code:"cancelled"}); } });
    stPost({kind:"ocr", id, prompt, images:imgs}); })
};

async function initClaudeDb(){
  let db = null;
  try { db = await (window.claude && claude.use ? claude.use("db") : null); } catch(e){ db=null; }
  if (!db){ await initFileMode(); return; }
  dbRef = db;
  try { const u = await claude.use("user"); if (u && u.can){ const w = await u.can("data.write"); if (w===false) canWrite=false; } } catch(e){}
  backend = makeDbBackend(db);
  $("#mode").innerHTML = "● Base partagée<br><span style='opacity:.7'>synchronisée en direct</span>";
  let pending = new Set([...COLLS,"settings"]);
  const timer = setTimeout(()=>{ if(pending.size){ $("#banner").innerHTML=`<div class="banner">Les données ne sont pas encore joignables. Elles s'afficheront dès que la connexion répond.</div>`; } },10000);
  const done = k => { if (pending.delete(k) && !pending.size){ clearTimeout(timer); $("#banner").innerHTML=""; loaded=true; migrateLegacy(); } };
  const err = e => { clearTimeout(timer); loaded=true; if(e && e.code!=="revoked") $("#banner").innerHTML=`<div class="banner">Connexion à la base interrompue. Rechargez la page plus tard.</div>`; render(); };
  for (const c of COLLS){
    const q = c==="movements" ? db.collection(c).orderBy("ts","desc").limit(1000) : db.collection(c);
    q.onSnapshot(snap=>{ const o={}; snap.docs.forEach(d=>{ o[d.id]=d.data(); }); S[c]=o; if(!snap.metadata.fromCache) done(c); render(); }, err);
  }
  db.doc("config/settings").onSnapshot(d=>{ if(d.exists) S.settings={...S.settings,...d.data()}; if(!d.metadata.fromCache) done("settings"); render(); }, err);
}

/* Conversion unique de l'ancien format (une fiche par palette) en lignes de quantité. */
async function migrateLegacy(){
  if (migrating || !canWrite || !dbRef) return;
  const old = Object.values(S.pallets); if (!old.length) return;
  migrating = true;
  try{
    const lease = await dbRef.doc("config/migration").acquire({holder:uid("H"), ttlMs:120000});
    if (!lease.acquired) return;
    const agg = {};
    for (const p of old){ if(!p.loc||!p.product) continue; const id=lineId(p.loc,p.product,p.dlc); (agg[id] ||= {loc:p.loc,product:p.product,dlc:dlcM(p.dlc),qty:0}).qty++; }
    for (const [id,x] of Object.entries(agg)) await backend.put("stock",id,{...x,qty:qty(S.stock[id])+x.qty});
    for (const p of old) await backend.del("pallets",p.id);
    toast("Stock converti en quantités par produit et DLC.");
  }catch(e){}
}

/* Tri du stock par emplacement : par défaut produit → dépôt → DLC → emplacement */
function stockCmp(a,b){ const {k,dir}=ui.stockSort;
  const P=(a.product||"").localeCompare(b.product||""), D=dkey(a.dlc).localeCompare(dkey(b.dlc)), E=locSort(locOf(a.loc),locOf(b.loc)), Q=qty(a)-qty(b);
  const A=(locOf(a.loc).aisle||"").localeCompare(locOf(b.loc).aisle||"",undefined,{numeric:true});
  if (k==="product") return dir*P || A || D || E;   // produit, puis groupé par dépôt, puis DLC, puis emplacement
  const first = k==="dlc"?D : k==="loc"?E : Q;
  return dir*first || P || A || D || E; }
function sortTh(k,label,cls=""){ const s=ui.stockSort, on=s.k===k; return `<th class="${cls}" style="cursor:pointer;user-select:none;${on?"color:var(--accent)":""}" onclick="ui.stockSort={k:'${k}',dir:${on?-s.dir:1}};render()" title="Trier">${label}${on?(s.dir>0?" ▲":" ▼"):""}</th>`; }
const prodOptions = sel => Object.values(S.products).sort((a,b)=>a.code.localeCompare(b.code)).map(p=>`<option value="${esc(p.code)}" ${sel===p.code?"selected":""}>${esc(p.code)}</option>`).join("");

/* ============ RÉCEPTION ============ */
/* Emplacements ayant de la place. Priorité : ceux contenant déjà le produit avec la même DLC,
   puis ceux contenant déjà le produit (autre DLC), puis le dépôt préféré, puis l'ordre dépôt/position. */
function prodRank(bl, lid, product, dlc){ const xs=(bl[lid]||[]).filter(x=>x.product===product);
  if(!product || !xs.length) return 2; return dlc && xs.some(x=>dlcM(x.dlc)===dlcM(dlc)) ? 0 : 1; }
function freeLocs(prefAisle, product, exclude=[], dlc=(ui.recep&&ui.recep.dlc)||""){
  const bl = byLoc(); const ex=new Set(exclude);
  const has = l => prodRank(bl, l.id, product, dlc);
  return Object.values(S.locations).filter(l=>!ex.has(l.id) && cap(l)-used(bl,l.id)>0)
    .map(l=>({...l, free:cap(l)-used(bl,l.id)}))
    .sort((a,b)=>{
      const h=has(a)-has(b); if(h) return h;
      if (prefAisle){ const pa=a.aisle===prefAisle?0:1, pb=b.aisle===prefAisle?0:1; if(pa!==pb) return pa-pb; }
      return locSort(a,b); });
}
const freeTotal = () => freeLocs().reduce((s,l)=>s+l.free,0);

  return `<div class="grid2"><div class="card"><h2>1. Saisie de la réception</h2>

      <div class="f"><label>Produit *</label><select id="r_p" onchange="ui.recep.product=this.value;ui.recep.plan=null;render()"><option value="">— choisir —</option>${prodOptions(r.product)}</select></div>
      <div class="f"><label>Date de péremption (mois / année) *</label><div class="row" style="gap:6px;flex-wrap:nowrap">
        <select id="r_dm" onchange="setDlc()"><option value="">Mois</option>${MOIS.map((n,i)=>{const v=String(i+1).padStart(2,"0");return `<option value="${v}" ${(r.dlcMo||"")===v?"selected":""}>${v} – ${n}</option>`}).join("")}</select>
        <select id="r_dy" onchange="setDlc()"><option value="">Année</option>${yearOpts(r.dlcY||"")}</select></div></div>
      <div class="row"><div class="f" style="flex:1"><label>Nombre de palettes *</label><input id="r_n" type="number" min="1" max="${nFree}" value="${r.n}" oninput="ui.recep.n=Math.max(1,parseInt(this.value)||1)" onchange="ui.recep.n=Math.max(1,parseInt(this.value)||1);if(ui.recep.plan){planRecep(true)}"></div>
      <div class="f" style="flex:1"><label>Dépôt préféré</label><select onchange="ui.recep.aisle=this.value;ui.recep.plan=null;render()"><option value="">Indifférent</option>${aisles.map(a=>`<option ${r.aisle===a?"selected":""}>${esc(a)}</option>`).join("")}</select></div></div>
      <div class="f"><label>Référence (bon de livraison, fournisseur…)</label><input id="r_r" value="${esc(r.ref)}" oninput="ui.recep.ref=this.value"></div>
      ${opField()}
      <div class="muted">${nFree} place(s) palette libre(s) dans le dépôt. Les emplacements contenant déjà ce produit sont proposés en premier (d'abord ceux avec la même DLC).</div>
      <div><button class="pri" onclick="planRecep()" ${ro()}>Proposer les emplacements →</button></div>
    </div></div>
    <div class="card"><h2>2. Placement & validation</h2>${r.plan ? (()=>{ const bl=byLoc(); const tot=r.plan.reduce((s,x)=>s+x.n,0);
      return `<p class="muted" style="margin-top:0"><b>${tot} / ${r.n}</b> palette(s) placée(s) · <b>${esc(r.product)}</b> · DLC ${fmtD(r.dlc)}. Vous pouvez changer les emplacements et les quantités.</p>
      <div class="scroll"><table><tr><th>Emplacement</th><th>Contenu actuel</th><th class="num">Palettes à poser</th><th></th></tr>${r.plan.map((x,i)=>{ const l=S.locations[x.loc]; const others=r.plan.filter((_,j)=>j!==i).map(y=>y.loc);
        const opts=[l?{...l,free:cap(l)-used(bl,l.id)}:null,...freeLocs(r.aisle,r.product,[x.loc,...others])].filter(Boolean);
        const content=(bl[x.loc]||[]); const n0=sumQ(content);
        const opt=o=>`<option value="${esc(o.id)}" ${o.id===x.loc?"selected":""}>${esc(L(o.id))} (${o.free} libre${o.free>1?"s":""})${prodRank(bl,o.id,r.product,r.dlc)<2?" ★":""}</option>`;
        const grp=(lab,arr)=>arr.length?`<optgroup label="${lab}">${arr.map(opt).join("")}</optgroup>`:"";
        const rk=o=>prodRank(bl,o.id,r.product,r.dlc);
        return `<tr><td><select onchange="movePlanLoc(${i},this.value)">${grp("★ Déjà ce produit, même DLC",opts.filter(o=>rk(o)===0))}${grp("★ Déjà ce produit, autre DLC",opts.filter(o=>rk(o)===1))}${grp("Autres emplacements",opts.filter(o=>rk(o)===2))}</select></td>
        <td class="muted" style="font-size:12.5px">${n0?`${n0}/${cap(l)} · ${content.map(c=>`${esc(c.product)} ${qty(c)}`).join(", ")}`:`vide (${cap(l)} places)`}</td>
        <td class="num"><input type="number" min="1" max="${l?cap(l)-used(bl,l.id):1}" value="${x.n}" style="width:70px" onchange="ui.recep.plan[${i}].n=Math.max(1,parseInt(this.value)||1);render()"></td>
        <td><button class="sm" onclick="ui.recep.plan.splice(${i},1);render()" title="Retirer">✕</button></td></tr>`; }).join("")}</table></div>
      ${tot!==r.n?`<div class="banner" style="margin:10px 0 0">${tot<r.n?`Il reste <b>${r.n-tot}</b> palette(s) à placer.`:`<b>${tot-r.n}</b> palette(s) de trop par rapport aux ${r.n} reçues.`}</div>`:""}
      <div class="row" style="margin-top:10px"><button class="sm" onclick="addPlanLoc()" ${tot>=r.n?"disabled":""}>+ Ajouter un emplacement</button></div>
      ${prodLocsHtml(bl)}
      <div class="row" style="margin-top:14px"><button class="pri" onclick="doRecep()" ${ro()} ${tot===r.n?"":"disabled"}>Valider l'entrée de ${r.n} palette(s)</button><button onclick="ui.recep.plan=null;render()">Annuler</button></div>`; })()
      : `<div class="empty">Remplissez le formulaire puis cliquez sur « Proposer les emplacements ».</div>`}
    </div></div>`;
}
/* Emplacements qui contiennent déjà le produit reçu : un clic les met dans le placement. */
function prodLocsHtml(bl){ const r=ui.recep; const inPlan=new Set(r.plan.map(x=>x.loc));
  const ls=Object.values(S.locations).filter(l=>prodRank(bl,l.id,r.product,r.dlc)<2)
    .sort((a,b)=>prodRank(bl,a.id,r.product,r.dlc)-prodRank(bl,b.id,r.product,r.dlc)||locSort(a,b));
  if(!ls.length) return `<p class="muted" style="font-size:12.5px;margin:12px 0 0">Ce produit n'est encore dans aucun emplacement.</p>`;
  return `<div style="margin-top:14px"><div style="font-size:12.5px;font-weight:600;margin-bottom:6px">★ Emplacements qui contiennent déjà ${esc(r.product)} <span class="muted" style="font-weight:400">— cliquez pour y poser les palettes</span></div>
    <div class="row" style="gap:6px">${ls.map(l=>{ const free=cap(l)-used(bl,l.id), xs=(bl[l.id]||[]).filter(x=>x.product===r.product), same=prodRank(bl,l.id,r.product,r.dlc)===0;
      return `<button class="sm${same?" yellow":""}" onclick="useRecepLoc('${esc(l.id)}')" ${free<=0||inPlan.has(l.id)?"disabled":""} title="${esc(xs.map(x=>qty(x)+" pal. DLC "+fmtD(x.dlc)).join(", "))}"><b>${esc(L(l.id))}</b> · ${sumQ(xs)} pal. ${xs.map(x=>fmtD(x.dlc)).join(" ")} · ${free>0?free+" libre(s)":"plein"}${inPlan.has(l.id)?" ✓":""}</button>`; }).join("")}</div>
    <p class="muted" style="font-size:12px;margin:6px 0 0">En jaune : même DLC que la réception.</p></div>`; }
function useRecepLoc(id){ const r=ui.recep; if(r.plan.some(x=>x.loc===id)) return;
  const tot=r.plan.reduce((s,x)=>s+x.n,0), free=cap(S.locations[id])-used(byLoc(),id);
  if(tot<r.n) r.plan.push({loc:id,n:Math.min(r.n-tot,free)});
  else return movePlanLoc(r.plan.length-1,id); // tout est déjà placé : remplace le dernier emplacement
  render(); }
const MOIS=["janvier","février","mars","avril","mai","juin","juillet","août","septembre","octobre","novembre","décembre"];
function yearOpts(sel){ const y=new Date().getFullYear(); let o=""; for(let k=y-1;k<=y+5;k++) o+=`<option value="${k}" ${String(k)===sel?"selected":""}>${String(k).slice(2)}</option>`; return o; }
function setDlc(){ const r=ui.recep; r.dlcMo=$("#r_dm").value; r.dlcY=$("#r_dy").value; r.dlc=(r.dlcMo&&r.dlcY)?`${r.dlcY}-${r.dlcMo}`:""; r._forceExp=false; r.plan=null; render(); }
function opField(){ return `<div class="f"><label>Opérateur</label><input id="op" value="${esc(opName)}" placeholder="Votre nom" oninput="opName=this.value;try{localStorage.setItem('depot_op',opName)}catch(e){}"></div>`; }
function planRecep(auto){
  const r=ui.recep;
  if(!r.product) return toast("Choisissez un produit.",true);
  if(!/^\d{4}-\d{2}$/.test(r.dlc)) return toast("Indiquez le mois et l'année de péremption.",true);
  if(monthsLeft(r.dlc)<0 && !r._forceExp){ return modal("DLC dépassée",`<p>Le mois ${fmtD(r.dlc)} est déjà passé. Enregistrer quand même ces palettes ?</p>`,[["Annuler"],["Continuer","pri",()=>{r._forceExp=true;planRecep();}]]); }
  const fl=freeLocs(r.aisle,r.product); const tot=fl.reduce((s,l)=>s+l.free,0);
  if(tot<r.n) return toast(`Pas assez de place : ${tot} place(s) libre(s) pour ${r.n} palette(s).`,true);
  let rest=r.n; r.plan=[];
  for(const l of fl){ if(!rest) break; const k=Math.min(rest,l.free); r.plan.push({loc:l.id,n:k}); rest-=k; }
  render();
}
function addPlanLoc(){ const r=ui.recep; const fl=freeLocs(r.aisle,r.product,r.plan.map(x=>x.loc)); if(!fl.length) return toast("Plus aucun emplacement avec de la place.",true); const rest=r.n-r.plan.reduce((s,x)=>s+x.n,0); if(rest<=0) return; r.plan.push({loc:fl[0].id,n:Math.min(rest,fl[0].free)}); render(); }
function movePlanLoc(i,loc){ const r=ui.recep, l=S.locations[loc]; const free=cap(l)-used(byLoc(),loc); r.plan[i].loc=loc; r.plan[i].n=Math.max(1,Math.min(r.plan[i].n,free)); render(); }
async function doRecep(){
  const r=ui.recep; const bl=byLoc();
  if(new Set(r.plan.map(x=>x.loc)).size!==r.plan.length) return toast("Un emplacement apparaît deux fois : regroupez les quantités.",true);
  for(const x of r.plan){ const l=S.locations[x.loc]; if(!l) return toast(`Emplacement ${L(x.loc)} introuvable.`,true);
    const free=cap(l)-used(bl,x.loc); if(x.n>free) return toast(`${L(x.loc)} : seulement ${free} place(s) libre(s).`,true); }
  const totP=r.plan.reduce((s,x)=>s+x.n,0); if(totP!==r.n) return toast(`Le placement (${totP}) ne correspond pas aux ${r.n} palettes reçues.`,true);
  const ref=r.ref.trim();
  try{
    for(const x of r.plan){ await addQty(x.loc, r.product, r.dlc, x.n); await logMove({type:"ENTREE",product:r.product,dlc:r.dlc,qty:x.n,from:"",to:x.loc,ref}); }
    toast(`${totP} palette(s) entrée(s) en stock.`); ui.recep={product:r.product,dlc:"",dlcMo:"",dlcY:"",n:1,aisle:r.aisle,ref:"",plan:null}; render();
  }catch(e){}
}

/* ============ SORTIE FEFO ============ */
function sortieCands(){ const s=ui.sortie; return s.product ? lines().filter(x=>x.product===s.product && (s.allowExp || status(x)!=="bad")).sort(fefo) : []; }
function sortieTake(){ const s=ui.sortie; const c=sortieCands();
  if (s.take){ const t={}; c.forEach(x=>{ if(s.take[x.id]) t[x.id]=Math.min(s.take[x.id],qty(x)); }); return t; }
  const t={}; let rest=s.n; for(const x of c){ if(rest<=0) break; const k=Math.min(rest,qty(x)); t[x.id]=k; rest-=k; } return t; }
function vSortie(){
  const s = ui.sortie ||= {product:"",n:1,ref:"",take:null,allowExp:false};
  const all = s.product ? lines().filter(x=>x.product===s.product) : [];
  const cands = sortieCands(); const avail=sumQ(cands); const nExp = sumQ(all)-avail;
  const take = sortieTake(); const tot = Object.values(take).reduce((a,b)=>a+b,0);
  return `<div class="grid2"><div class="card"><h2>1. Commande</h2>
    <div class="row" style="flex-direction:column;align-items:stretch;gap:12px">
    <div class="f"><label>Produit *</label><select onchange="ui.sortie.product=this.value;ui.sortie.take=null;render()"><option value="">— choisir —</option>${prodOptions(s.product)}</select></div>
    <div class="row"><div class="f" style="flex:1"><label>Nombre de palettes *</label><input id="s_n" type="number" min="1" value="${s.n}" oninput="ui.sortie.n=Math.max(1,parseInt(this.value)||1);ui.sortie.take=null;render()"></div>
    <div class="f" style="flex:1"><label>Référence (n° commande, client…)</label><input id="s_r" value="${esc(s.ref)}" oninput="ui.sortie.ref=this.value"></div></div>
    ${opField()}
    <label style="display:flex;gap:8px;align-items:center"><input type="checkbox" ${s.allowExp?"checked":""} onchange="ui.sortie.allowExp=this.checked;ui.sortie.take=null;render()"> Autoriser la sortie de palettes périmées (destruction, retour…)</label>
    ${s.product?`<div class="muted">${avail} palette(s) disponible(s)${nExp&&!s.allowExp?` · ${nExp} périmée(s) bloquée(s)`:""}.</div>`:""}
    ${s.product && avail<s.n?`<div class="banner" style="margin:0">Stock insuffisant : ${avail} disponible(s) pour ${s.n} demandée(s).</div>`:""}
    </div></div>
    <div class="card"><h2>2. Prélèvement <span class="muted" style="font-weight:400">— règle FEFO : 1<sup>re</sup> périmée, 1<sup>re</sup> sortie</span></h2>
    ${!s.product?`<div class="empty">Choisissez un produit.</div>`: !cands.length?`<div class="empty">Aucune palette disponible.</div>`:`
      <div class="scroll"><table><tr><th>Emplacement</th><th>DLC</th><th>Reste</th><th class="num">En stock</th><th class="num">À prélever</th></tr>${cands.map(x=>`<tr><td class="mono">${esc(L(x.loc))}</td><td>${DL(x.product,x.dlc)}</td><td>${stTag(x)}</td><td class="num">${qty(x)}</td><td class="num"><input type="number" min="0" max="${qty(x)}" value="${take[x.id]||0}" style="width:70px" onchange="setTake('${esc(x.id)}',this.value)"></td></tr>`).join("")}</table></div>
      ${tot!==s.n?`<div class="banner" style="margin:10px 0 0">Total prélevé : <b>${tot}</b> palette(s) pour ${s.n} demandée(s).</div>`:""}
      <div class="row" style="margin-top:14px"><button class="pri" onclick="doSortie()" ${ro()} ${tot?"":"disabled"}>Valider la sortie de ${tot} palette(s)</button><button onclick="copyPick()">Copier la liste de prélèvement</button></div>`}
    </div></div>`;
}
function setTake(id,v){ const s=ui.sortie; const t=sortieTake(); const x=S.stock[id]; t[id]=Math.max(0,Math.min(qty(x),parseInt(v)||0)); s.take=t; render(); }
async function doSortie(){
  const s=ui.sortie; const t=sortieTake(); const ids=Object.keys(t).filter(id=>t[id]>0&&S.stock[id]); if(!ids.length) return;
  let n=0;
  try{ for(const id of ids){ const x=S.stock[id], k=Math.min(t[id],qty(x)); if(!k) continue; await removeQty(x,k,status(x)==="bad"?"REBUT":"SORTIE",s.ref.trim()); n+=k; }
    toast(`${n} palette(s) sortie(s) du stock.`); ui.sortie={product:s.product,n:1,ref:"",take:null,allowExp:false}; render(); }catch(e){}
}
async function removeQty(x,k,type,ref){ const {loc,product,dlc}=x; await addQty(loc,product,dlc,-k); await logMove({type,product,dlc:dlcM(dlc),qty:k,from:loc,to:"",ref:ref||""}); }
function copyPick(){ const t=sortieTake(); const rows=Object.keys(t).filter(id=>t[id]>0&&S.stock[id]).map(id=>({...S.stock[id],k:t[id]})).sort((a,b)=>locSort(locOf(a.loc),locOf(b.loc)));
  copyText(`Prélèvement ${ui.sortie.ref||""}\n`+rows.map(x=>`${L(x.loc)}\t${x.product}\t${x.k} pal.\tDLC ${fmtD(x.dlc)}`).join("\n"),"Liste copiée."); }

/* ============ PRÉPARATION DE COMMANDE ============
   Commande importée d'un PDF/photo (lue par Claude) ou saisie à la main.
   Règle de proposition : dans les dépôts choisis, DLC la plus courte d'abord, puis à DLC égale
   l'emplacement contenant le MOINS de palettes de ce produit, puis ordre du dépôt. */
function cmdState(){ return ui.cmd ||= {file:"",ref:"",lines:[],doubt:[],aisles:null,allowExp:false,take:null}; }
const allAisles = () => [...new Set(Object.values(S.locations).map(l=>l.aisle))].sort((a,b)=>a.localeCompare(b,undefined,{numeric:true}));
function cmdAisles(){ const c=cmdState(); return c.aisles || allAisles(); }
function cmdNeed(){ const need={}; cmdState().lines.forEach(l=>{ const k=String(l.code||"").trim().toUpperCase(), n=parseInt(l.n)||0; if(k&&n>0) need[k]=(need[k]||0)+n; }); return need; }
/* Nombre de palettes d'un produit dans un emplacement (toutes DLC confondues) */
function prodInLoc(bl,loc,code){ return sumQ((bl[loc]||[]).filter(y=>y.product===code)); }
function cmdCands(code){ const c=cmdState(), ais=cmdAisles(), bl=byLoc();
  return lines().filter(x=>x.product===code && ais.includes(locOf(x.loc).aisle) && (c.allowExp||status(x)!=="bad"))
    .sort((a,b)=>dkey(a.dlc).localeCompare(dkey(b.dlc)) || prodInLoc(bl,a.loc,code)-prodInLoc(bl,b.loc,code) || locSort(locOf(a.loc),locOf(b.loc))); }
function cmdTake(){ const c=cmdState(), need=cmdNeed(), t={};
  if(c.take){ for(const [id,k] of Object.entries(c.take)){ const x=S.stock[id]; if(x&&k>0&&need[x.product]) t[id]=Math.min(k,qty(x)); } return t; }
  for(const [code,n] of Object.entries(need)){ let rest=n; for(const x of cmdCands(code)){ if(rest<=0) break; const k=Math.min(rest,qty(x)); t[x.id]=k; rest-=k; } }
  return t; }
function vCmd(){
  const c=cmdState(), need=cmdNeed(), take=cmdTake(), ais=cmdAisles(), bl=byLoc();
  const prodList=`<datalist id="cmd_list">${Object.values(S.products).sort((a,b)=>a.code.localeCompare(b.code)).map(p=>`<option value="${esc(p.code)}">`).join("")}</datalist>`;
  const dispo=code=>sumQ(cmdCands(code));
  const totTake=Object.values(take).reduce((a,b)=>a+b,0), totNeed=Object.values(need).reduce((a,b)=>a+b,0);
  const linesHtml = c.lines.length ? `<div class="scroll"><table class="impt"><tr><th>Produit</th><th class="num">Palettes demandées</th><th class="num">Dispo (dépôts choisis)</th><th>Remarque</th><th></th></tr>
    ${c.lines.map((l,i)=>{ const code=String(l.code||"").trim().toUpperCase(), n=parseInt(l.n)||0, known=!!S.products[safeId(code)], d=code?dispo(code):0;
      const rem = !code?'<span style="color:var(--bad)">code manquant</span>' : !known?'<span style="color:var(--bad)">produit inconnu</span>' : !(n>0)?'<span style="color:var(--bad)">quantité invalide</span>' : d<need[code]?`<span style="color:#a26700">stock insuffisant${cmdElsewhere(code).length?` · présent dans le dépôt ${cmdElsewhere(code).map(e=>esc(e.aisle)).join(", ")}`:""}</span>`:'<span class="muted">OK</span>';
      return `<tr style="${c.doubt[i]?"background:var(--soonbg)":""}"><td><input id="cmd_c${i}" class="mono" list="cmd_list" value="${esc(l.code)}" style="width:140px" onchange="cmdState().lines[${i}].code=this.value;cmdState().take=null;render()"></td>
        <td class="num"><input id="cmd_n${i}" type="number" min="1" value="${esc(l.n)}" style="width:70px" onchange="cmdState().lines[${i}].n=this.value;cmdState().take=null;render()"></td>
        <td class="num">${code&&known?d:"—"}</td><td style="font-size:12.5px">${rem}${c.doubt[i]?' · <i>lu avec un doute</i>':""}</td>
        <td><button class="sm" onclick="cmdState().lines.splice(${i},1);cmdState().doubt.splice(${i},1);cmdState().take=null;render()">✕</button></td></tr>`; }).join("")}</table></div>${prodList}`
    : `<div class="empty">Importez un bon de commande (PDF ou photo) ou ajoutez les lignes à la main.</div>`;
  // proposition
  const prods=Object.keys(need).sort(); let pick="";
  if(prods.length){ pick=prods.map((code,pi)=>{ const cs=cmdCands(code); const taken=cs.reduce((a,x)=>a+(take[x.id]||0),0);
      const head=`<tr class="${pi?"prod-sep":""}"><td colspan="6" style="background:#f6f8fa"><b class="mono">${esc(code)}</b> — ${taken} / ${need[code]} palette(s) ${taken<need[code]?`<span class="tag t-soon">manque ${need[code]-taken}</span>`:taken>need[code]?`<span class="tag t-soon">${taken-need[code]} de trop</span>`:`<span class="tag t-ok">complet</span>`}${taken<need[code]?cmdElseHtml(code,need[code]-taken):""}</td></tr>`;
      if(!cs.length) return head+`<tr><td colspan="6" class="muted">Aucune palette disponible dans les dépôts choisis.</td></tr>`;
      return head+cs.map(x=>`<tr style="${take[x.id]?"":"opacity:.55"}"><td class="mono"><b>${esc(L(x.loc))}</b></td><td class="num">${prodInLoc(bl,x.loc,x.product)}</td><td>${DL(x.product,x.dlc)}</td><td>${stTag(x)}</td><td class="num">${qty(x)}</td>
        <td class="num"><input id="cmd_t_${esc(x.id)}" type="number" min="0" max="${qty(x)}" value="${take[x.id]||0}" style="width:64px" onchange="cmdSetTake('${esc(x.id)}',this.value)"></td></tr>`).join(""); }).join(""); }
  return `<div class="grid2">
  <div class="card"><h2><span class="x">1. Commande ${c.file?`<span class="muted" style="font-weight:400">· ${esc(c.file)}</span>`:""}</span></h2>
    <div class="row" style="margin-bottom:12px">
      <button class="yellow needs-claude" onclick="claudeThen('#cmdfile',&quot;L'import d'une commande PDF&quot;)" ${ro()}>📄 Importer une commande PDF</button>
      <input type="file" id="cmdfile" accept=".pdf,image/jpeg,image/png,image/webp" style="display:none" onchange="importCmd(this)">
      <button onclick="cmdState().lines.push({code:'',n:''});cmdState().doubt.push(false);render();setTimeout(()=>$('#cmd_c'+(cmdState().lines.length-1))?.focus(),30)">+ Ajouter une ligne</button>
      ${c.lines.length?`<button class="danger" onclick="cmdCancel()">✕ Annuler la commande</button>`:""}
    </div>
    <div class="row" style="margin-bottom:12px"><div class="f" style="flex:1"><label>Référence de la commande (client, n° de bon…)</label><input id="cmd_ref" value="${esc(c.ref)}" oninput="cmdState().ref=this.value"></div>${opField()}</div>
    ${linesHtml}
  </div>
  <div class="card"><h2>2. Dépôts où prendre les palettes</h2>

/* Autres dépôts (non cochés) où le produit est disponible : [{aisle, n}] */
function cmdElsewhere(code){ const c=cmdState(), ais=cmdAisles(), g={};
  lines().filter(x=>x.product===code && !ais.includes(locOf(x.loc).aisle) && (c.allowExp||status(x)!=="bad")).forEach(x=>{ const a=locOf(x.loc).aisle||"?"; g[a]=(g[a]||0)+qty(x); });
  return Object.entries(g).map(([aisle,n])=>({aisle,n})).sort((a,b)=>b.n-a.n||a.aisle.localeCompare(b.aisle)); }
const cmdElseHtml = (code,missing) => { const el=cmdElsewhere(code); if(!el.length) return `<div class="muted" style="font-size:12.5px;margin-top:4px">Produit absent des autres dépôts.</div>`;
  return `<div style="font-size:12.5px;margin-top:6px;display:flex;flex-wrap:wrap;gap:6px;align-items:center"><span>Disponible dans un autre dépôt :</span>${el.map(e=>`<button class="sm yellow" onclick="cmdToggleAisle('${esc(e.aisle)}',true)" title="Ajouter ce dépôt à la préparation">+ Dépôt ${esc(e.aisle)} · ${e.n} pal.${e.n>=missing?" ✓":""}</button>`).join("")}</div>`; };
function cmdCancel(){ const c=cmdState();
  modal("Annuler la commande",`<p>Abandonner la préparation${c.ref?` de « ${esc(c.ref)} »`:""} ? Les lignes saisies et la proposition seront effacées. <b>Le stock n'est pas modifié.</b></p>`,
  [["Non, continuer"],["Oui, annuler la commande","danger",()=>{ ui.cmd=null; render(); toast("Commande annulée — stock inchangé."); }]]); }
function cmdToggleAisle(a,on){ const c=cmdState(); const s=new Set(cmdAisles()); on?s.add(a):s.delete(a); c.aisles=[...s]; c.take=null; render(); }
function cmdSetTake(id,v){ const c=cmdState(), t=cmdTake(), x=S.stock[id]; t[id]=Math.max(0,Math.min(qty(x),parseInt(v)||0)); c.take=t; render(); }
function cmdPicks(){ const t=cmdTake(); return Object.keys(t).filter(id=>t[id]>0&&S.stock[id]).map(id=>({...S.stock[id],k:t[id]})).sort((a,b)=>locSort(locOf(a.loc),locOf(b.loc))||a.product.localeCompare(b.product)); }
function cmdCopy(){ const c=cmdState(); copyText(`Commande ${c.ref||""}\n`+cmdPicks().map(x=>`${L(x.loc)}\t${x.product}\t${x.k} pal.\tDLC ${fmtD(x.dlc)}`).join("\n"),"Liste de prélèvement copiée."); }
async function cmdExcel(){ const c=cmdState(), ps=cmdPicks(); if(!ps.length) return;
  const rows=ps.map(x=>[{v:L(x.loc),s:{b:true,bg:(depotBg(x.loc)||"").replace("#","").toUpperCase()||undefined}},{v:x.product},{v:x.k,s:{right:true}},{v:dlcM(x.dlc)?fmtD(x.dlc):""},{v:""}]);
  const blob=buildXlsx([{name:"Prélèvement",head:["Emplacement","Produit","Palettes","DLC","Pris ✓"],widths:[13,16,10,9,9],rows}]);
  const d=new Date(), name=`prelevement-${(c.ref||"commande").replace(/[^A-Za-z0-9_-]+/g,"_").slice(0,40)}-${d.getFullYear()}${String(d.getMonth()+1).padStart(2,"0")}${String(d.getDate()).padStart(2,"0")}.xlsx`;
  let dl=null; try{ dl=window.claude&&claude.use?await claude.use("downloads"):null; }catch(e){}
  if(dl){ try{ await dl.save({filename:name,data:blob}); toast("Liste enregistrée."); }catch(e){ if(e&&e.code!=="declined") toast("Le téléchargement n'est pas disponible ici.",true); } return; }
  try{ const a=document.createElement("a"); a.href=URL.createObjectURL(blob); a.download=name; document.body.appendChild(a); a.click(); setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove();},1000); }catch(e){ toast("Le téléchargement n'est pas disponible ici.",true); }
}
async function doCmd(){ const c=cmdState(), ps=cmdPicks(); if(!ps.length) return; const ref=("Commande "+(c.ref||"")).trim();
  const need=cmdNeed(), taken={}; ps.forEach(x=>taken[x.product]=(taken[x.product]||0)+x.k);
  const short=Object.keys(need).filter(k=>(taken[k]||0)<need[k]);
  modal("Valider la sortie",`<p>Sortir <b>${ps.reduce((a,x)=>a+x.k,0)}</b> palette(s) du stock pour « ${esc(ref)} » ?</p>${short.length?`<div class="banner" style="margin:0">Commande incomplète pour : ${short.map(k=>`${esc(k)} (${taken[k]||0}/${need[k]})`).join(", ")}</div>`:""}`,
  [["Annuler"],["Valider","pri",async()=>{ let n=0; for(const x of ps){ const cur=S.stock[x.id]; if(!cur) continue; const k=Math.min(x.k,qty(cur)); if(!k) continue; await removeQty(cur,k,"SORTIE",ref); n+=k; }
    toast(`${n} palette(s) sortie(s) du stock.`); ui.cmd=null; render(); }, !canWrite]]);
}
async function importCmd(input){
  const f=input.files&&input.files[0]; input.value=""; if(!f) return;
  const sample=await getSample(); if(!sample) return claudeNeeded("L'import d'une commande PDF");
  const lim=await sample.limits().catch(()=>null); if(!lim||!lim.images) return claudeNeeded("L'import d'une commande PDF");
  ocrCtl=new AbortController();
  modal("Lecture de la commande",`<p id="ocr_msg">Préparation du fichier « ${esc(f.name)} »…</p><p class="muted" style="font-size:12.5px">La lecture peut prendre jusqu'à une ou deux minutes.</p>`,[["Arrêter","",()=>{ ocrCtl&&ocrCtl.abort(); }]]);
  const msg=t=>{ const el=$("#ocr_msg"); if(el) el.textContent=t; }, closeWait=()=>{ const el=$("#ocr_msg"); if(el) el.closest(".ov").remove(); };
  let images=[];
  try{ if(/\.pdf$/i.test(f.name)||f.type==="application/pdf"){ msg("Conversion des pages du PDF…"); images=(await pdfToImages(await f.arrayBuffer(), lim.images.maxCount)).images; } else images=[f]; }
  catch(e){ closeWait(); return toast("Impossible d'ouvrir ce PDF. Vous pouvez aussi importer une photo (JPG ou PNG).",true); }
  const prods=Object.values(S.products).map(p=>p.code).sort();
  const prompt=`Tu lis un bon de commande de palettes d'eau (imprimé ou écrit à la main, en français).
Relève chaque produit commandé et le nombre de PALETTES demandé. Ignore prix, adresses, totaux généraux et mentions légales.
Codes produits connus du dépôt (utilise le code connu qui correspond le mieux, sans en inventer ; si aucun ne correspond, recopie le code lu) : ${prods.join(", ")||"aucun"}.
Si la quantité est exprimée autrement qu'en palettes et que tu ne peux pas la convertir, mets "doute": true.
Réponds uniquement en JSON :
{"reference":"n° de commande ou nom du client, ou \"\"","lignes":[{"code":"EAU-PL-150","palettes":4,"doute":false}]}`;
  msg("Lecture de la commande par Claude…");
  let data;
  try{ data=await sample.json(prompt,{images,modelTier:"complex",signal:ocrCtl.signal}); }
  catch(e){ closeWait(); if(e&&e.code==="cancelled") return;
    const m={not_granted:"Vous n'avez pas autorisé ce logiciel à utiliser Claude.",rate_limited:"Trop de demandes pour le moment, réessayez dans quelques minutes.",image_rejected:"Le fichier n'a pas pu être envoyé (format ou taille).",invalid_json:"La réponse n'a pas pu être lue, réessayez.",refused:"Claude n'a pas pu lire ce document.",session_expired:"Reconnectez-vous à Claude puis réessayez."};
    return toast(m[e&&e.code]||(e&&e.msg)||"La lecture a échoué, réessayez.",true); }
  closeWait();
  const arr=Array.isArray(data)?data:(data&&Array.isArray(data.lignes)?data.lignes:[]);
  const ls=arr.filter(r=>r&&typeof r==="object").map(r=>({code:String(r.code??"").trim().toUpperCase(), n:String(parseInt(r.palettes)||"")}));
  if(!ls.length) return toast("Aucune ligne de commande n'a été trouvée.",true);
  const c=cmdState(); c.file=f.name; c.ref=(data&&data.reference)?String(data.reference):c.ref; c.lines=ls; c.doubt=arr.map(r=>!!(r&&r.doute)); c.take=null;
  location.hash="commande"; render(); toast(`${ls.length} ligne(s) lue(s) : vérifiez-les puis choisissez les dépôts.`);
}

async function loadPdfJs(){ if(window.pdfjsLib && window.pdfjsWorker) return window.pdfjsLib;

async function pdfToImages(buf, max){

    out.push(await new Promise(r=>c.toBlob(r,"image/jpeg",0.9))); }

  if(!FS.name){ m.innerHTML="Fichier de données<br><span style='opacity:.7'>aucun fichier ouvert</span>"; return; }
  const st = FS.saving ? "enregistrement…" : FS.handle ? (FS.dirty?"modifications en attente":"enregistré ✓") : (FS.dirty?"<b style='color:#ffd43b'>non enregistré</b>":"à jour");
  m.innerHTML=`📄 ${esc(FS.name)}<br><span style='opacity:.8'>${st}</span>${!FS.handle&&FS.name?`<br><button class="sm yellow" style="margin-top:6px" onclick="fileDownload()">Enregistrer le fichier</button>`:""}`; }
async function fileSave(){
  if(!FS.handle) return; if(FS.saving){ FS.again=true; return; }
  FS.saving=true; fileStatus();
  try{ const w=await FS.handle.createWritable(); await w.write(buildDataWorkbook()); await w.close(); FS.lastSaved=Date.now(); FS.dirty=false; }
  catch(e){ toast("Enregistrement impossible : fermez le fichier dans Excel puis refaites la dernière action.",true); }
  FS.saving=false; fileStatus(); if(FS.again){ FS.again=false; fileSave(); }
}
function fileDownload(){ const blob=buildDataWorkbook(); const a=document.createElement("a"); a.href=URL.createObjectURL(blob); a.download=FS.name||dataFileName(); document.body.appendChild(a); a.click(); setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove();},1000); FS.dirty=false; fileStatus(); }
const idb = (op,val) => new Promise(res=>{ try{ const r=indexedDB.open("depot-fichier",1); r.onupgradeneeded=()=>r.result.createObjectStore("h"); r.onerror=()=>res(null);
  r.onsuccess=()=>{ const tx=r.result.transaction("h",op==="get"?"readonly":"readwrite"), st=tx.objectStore("h"); const q=op==="get"?st.get("file"):st.put(val,"file"); q.onsuccess=()=>res(q.result||null); q.onerror=()=>res(null); }; }catch(e){ res(null); } });
async function fileUse(handle){ const f=await handle.getFile(); const r=await loadDataWorkbook(await f.arrayBuffer());
  FS.handle=handle; FS.name=f.name; FS.lastSaved=f.lastModified; FS.dirty=false; loaded=true; idb("put",handle); $("#banner").innerHTML="";
  fileStatus(); render(); toast(`« ${f.name} » ouvert${r.bad?` — ${r.bad} ligne(s) de stock illisible(s) ignorée(s)`:""}.`); }
const XLSX_TYPES=[{description:"Classeur Excel",accept:{"application/vnd.openxmlformats-officedocument.spreadsheetml.sheet":[".xlsx"]}}];
async function fileOpen(){
  if(FS.fallback) return $("#datafile").click();
  try{ const [h]=await window.showOpenFilePicker({types:XLSX_TYPES,multiple:false}); if((await h.requestPermission({mode:"readwrite"}))!=="granted") return toast("Autorisation d'écriture refusée.",true); await fileUse(h); }
  catch(e){ if(e&&e.name!=="AbortError") toast("Impossible d'ouvrir ce fichier de données.",true); }
}
async function fileCreate(){
  if(FS.fallback){ S.products={};S.locations={};S.stock={};S.movements={}; FS.name=dataFileName(); FS.dirty=true; loaded=true; fileStatus(); render(); return; }
  try{ const h=await window.showSaveFilePicker({suggestedName:dataFileName(),types:XLSX_TYPES}); S.products={};S.locations={};S.stock={};S.movements={};S.settings={alertMonths:2};
    FS.handle=h; FS.name=h.name; loaded=true; idb("put",h); await fileSave(); render(); toast("Nouveau fichier de données créé."); }
  catch(e){ if(e&&e.name!=="AbortError") toast("Impossible de créer le fichier.",true); }
}
async function fileReopen(){ const h=FS.saved; if(!h) return; try{ if((await h.requestPermission({mode:"readwrite"}))!=="granted") return toast("Autorisation refusée.",true); await fileUse(h); }catch(e){ toast("Le fichier n'est plus disponible : ouvrez-le à nouveau.",true); } }
async function fileInputPicked(inp){ const f=inp.files&&inp.files[0]; inp.value=""; if(!f) return;
  try{ const r=await loadDataWorkbook(await f.arrayBuffer()); FS.name=f.name; FS.dirty=false; loaded=true; fileStatus(); render(); toast(`« ${f.name} » ouvert${r.bad?` — ${r.bad} ligne(s) ignorée(s)`:""}. Pensez à « Enregistrer le fichier » après vos modifications.`); }
  catch(e){ toast("Ce fichier n'est pas un fichier de données valide.",true); } }
function vFileStart(){
  return `<div class="card" style="max-width:680px"><h2>📄 Fichier de données</h2>
    <p>Dans cette version, les palettes sont gardées dans un <b>fichier Excel séparé</b> (par exemple <span class="mono">donnees-palettes.xlsx</span>) que le logiciel lit et met à jour${FS.fallback?"":" automatiquement après chaque modification"}.</p>
    <div class="row" style="gap:10px;margin:14px 0">
      ${FS.saved?`<button class="pri" onclick="fileReopen()">Rouvrir « ${esc(FS.saved.name)} »</button>`:""}
      <button class="${FS.saved?"":"pri"}" onclick="fileOpen()">Ouvrir un fichier de données…</button>
      <button onclick="fileCreate()">Créer un nouveau fichier</button>
      <input type="file" id="datafile" accept=".xlsx" style="display:none" onchange="fileInputPicked(this)">
    </div>
    ${FS.fallback?`<div class="banner" style="margin:0">Ce navigateur ne permet pas l'enregistrement automatique : utilisez Google Chrome ou Microsoft Edge. Sinon, cliquez sur « Enregistrer le fichier » (en bas à gauche) après vos modifications.</div>`:""}
    <p class="muted" style="font-size:12.5px;margin-bottom:0">Vous pouvez aussi ouvrir ce fichier dans Excel pour le consulter. Fermez-le dans Excel pendant que vous travaillez dans le logiciel.</p></div>`;
}
async function initFileMode(){
  document.body.classList.add("noclaude"); backend=fileBackend; FS.saved=await idb("get"); fileStatus(); render();
  window.addEventListener("focus", async ()=>{ if(!FS.handle||FS.saving) return; try{ const f=await FS.handle.getFile(); if(f.lastModified>FS.lastSaved+1500){ FS.lastSaved=f.lastModified;
    $("#banner").innerHTML=`<div class="banner">« ${esc(f.name)} » a été modifié en dehors du logiciel (dans Excel ?). <button class="sm" onclick="fileUse(FS.handle)">Recharger le fichier</button></div>`; } }catch(e){} });
  window.addEventListener("beforeunload", e=>{ if(FS.dirty){ e.preventDefault(); e.returnValue=""; } });
}

/* ============ RECHERCHE ============ */
$("#q").addEventListener("input",e=>{ const q=e.target.value.trim().toLowerCase(), box=$("#qres"); if(q.length<2){ box.style.display="none"; return; }
  const res=[]; for(const x of lines().sort(fefo)) if([x.loc,L(x.loc),x.product,prodName(x.product)].join(" ").toLowerCase().includes(q)) res.push(`<div onclick="lineDetail('${esc(x.id)}')"><b class="mono">${esc(L(x.loc))}</b> · ${esc(x.product)} · <b>${qty(x)}</b> pal. · DLC ${DL(x.product,x.dlc)} ${stTag(x)}</div>`);
  const bl=byLoc(); const lr=[]; for(const l of Object.values(S.locations).sort(locSort)) if((l.id+" "+L(l.id)).toLowerCase().includes(q)) lr.push(`<div onclick="locDetail('${esc(l.id)}')"><b class="mono">${esc(L(l.id))}</b> · emplacement ${used(bl,l.id)}/${cap(l)} palette(s)</div>`);
  box.innerHTML = [...lr,...res].slice(0,30).join("") || `<div class="muted">Aucun résultat</div>`; box.style.display="block"; });
document.addEventListener("click",e=>{ if(!e.target.closest(".search")) $("#qres").style.display="none"; });

/* ============ OUTILS ============ */
function modal(title, body, actions){
  const ov=document.createElement("div"); ov.className="ov";
  ov.innerHTML=`<div class="modal"><h3>${title}</h3>${body}<div class="acts">${actions.map((a,i)=>`<button data-i="${i}" class="${a[1]||""}" ${a[3]?"disabled":""}>${a[0]}</button>`).join("")}</div></div>`;
  const close=()=>ov.remove();
  ov.addEventListener("click",async e=>{ if(e.target===ov) return close(); const b=e.target.closest("button[data-i]"); if(!b) return; const a=actions[+b.dataset.i];
    if(a[2]){ b.disabled=true; let r; try{ r=await a[2](); }catch(err){ r=false; } b.disabled=false; if(r===false) return; } close(); });
  document.body.appendChild(ov);
}
function copyText(t,msg){ (navigator.clipboard?navigator.clipboard.writeText(t):Promise.reject()).then(()=>toast(msg||"Copié."),()=>{ modal("Copier",`<textarea style="width:100%;height:240px" class="mono">${esc(t)}</textarea><p class="muted">Sélectionnez le texte et copiez-le (Ctrl+C).</p>`,[["Fermer","pri"]]); }); }
function copyCsv(kind){
  const q=v=>`"${String(v??"").replace(/"/g,'""')}"`; let rows;
  if(kind==="stock") rows=[["Emplacement","Code produit","Palettes","DLC","Mois restants"],...lines().sort(fefo).map(x=>[L(x.loc),x.product,qty(x),fmtD(x.dlc),dlcM(x.dlc)?monthsLeft(x.dlc):""])];
  else rows=[["Date","Type","Code produit","Palettes","DLC","De","Vers","Référence","Opérateur"],...Object.values(S.movements).sort((a,b)=>b.ts-a.ts).map(m=>[new Date(m.ts).toISOString(),m.type,m.product,mq(m),fmtD(m.dlc),L(m.from),L(m.to),m.ref,m.op])];
  copyText(rows.map(r=>r.map(q).join(";")).join("\n"),"CSV copié : collez-le dans Excel.");
}
async function loadDemo(){
  if(Object.keys(S.products).length||Object.keys(S.locations).length) return toast("Le dépôt contient déjà des données.",true);
  toast("Chargement des données de démonstration…");
  const prods=["EAU-PL-150","EAU-GAZ-150","EAU-PL-050","EAU-CIT-100"];
  try{
    for(const code of prods) await backend.put("products",safeId(code),{code,name:"",format:"",perPallet:""});
    const locIds=[]; for(const a of ["A","B","C"]) for(let p=1;p<=10;p++){ const id=`${a}-${String(p).padStart(2,"0")}`; locIds.push(id); await backend.put("locations",id,{aisle:a,pos:p,level:0,cap:6}); }
    const offs=[-1,0,1,2,4,6,9,14]; let i=0;
    for(const id of locIds){ if(Math.random()<.4) continue; let room=6;
      const nl=1+Math.floor(Math.random()*3);
      for(let j=0;j<nl && room>0;j++){ const k=1+Math.floor(Math.random()*Math.min(3,room)); room-=k; const d=new Date(); d.setDate(1); d.setMonth(d.getMonth()+offs[(i*5+3)%offs.length]);
        await addQty(id, prods[(i+j)%4], `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,"0")}`, k); i++; } }
    toast("Données de démonstration chargées.");
  }catch(e){}
}

route(); init();
</script>
